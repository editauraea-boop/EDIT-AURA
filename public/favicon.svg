<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Rounded Badge -->
  <rect width="100" height="100" rx="24" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Ambient Aura Glow in Center -->
  <circle cx="50" cy="50" r="40" fill="url(#auraGlow)"/>
  
  <!-- High Contrast Aura Symbol: EDIT AURA Pause Bars & Modern Typography -->
  <!-- Left Bar -->
  <rect x="28" y="26" width="16" height="48" rx="5" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(168,85,247,0.5))"/>
  
  <!-- Right Bar with Gradient Accent -->
  <rect x="56" y="26" width="16" height="48" rx="5" fill="#c084fc" filter="drop-shadow(0 2px 8px rgba(192,132,252,0.6))"/>
  
  <!-- Micro Dot Accent -->
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
