<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogGlow" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#050505"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing Aura Orbs -->
  <circle cx="950" cy="280" r="380" fill="url(#ogGlow)"/>
  <circle cx="200" cy="550" r="280" fill="#6366f1" fill-opacity="0.08"/>

  <!-- Left Content Box -->
  <g transform="translate(100, 100)">
    
    <!-- Top Pill Badge -->
    <rect width="280" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="20" cy="19" r="5" fill="#a855f7"/>
    <text x="35" y="24" fill="#a855f7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2">NEXT-GEN DIGITAL GROWTH</text>

    <!-- Main Headline -->
    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      WE DON'T JUST MARKET BRANDS.
    </text>
    <text x="0" y="175" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      WE BUILD THEIR <tspan fill="url(#textGrad)">AURA.</tspan>
    </text>

    <!-- Tagline Subtext -->
    <text x="0" y="240" fill="#a1a1aa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="400">
      Branding · Performance Marketing · AI Workflows · Short-Form Content · Web Dev
    </text>

    <!-- Trust Stats Cards -->
    <g transform="translate(0, 290)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="180" height="90" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="24" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900">4.8x</text>
      <text x="24" y="68" fill="#a1a1aa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Avg. Meta Ads ROAS</text>

      <!-- Card 2 -->
      <rect x="200" y="0" width="180" height="90" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="224" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900">1.2M+</text>
      <text x="224" y="68" fill="#a1a1aa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Monthly Video Reach</text>

      <!-- Card 3 -->
      <rect x="400" y="0" width="200" height="90" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="424" y="44" fill="#c084fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900">₹10K/mo</text>
      <text x="424" y="68" fill="#a1a1aa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Retainers Starting From</text>
    </g>

    <!-- Footer Agency Signature -->
    <text x="0" y="450" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1">
      HQ: PUNE, INDIA · GLOBAL CLIENTS · editaura.com
    </text>
  </g>
</svg>
